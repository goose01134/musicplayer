<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicPlayer</title>

  <!-- Merriweather Font -->
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap" rel="stylesheet">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- iOS Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="apple-touch-icon" href="assets/icon.png">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>MusicPlayer</h1>
  <p id="mode"></p>

  <!-- Search Bar -->
  <input id="search" type="text" placeholder="Search music...">

  <!-- Song List -->
  <div id="songList">
    <!-- You will fill this with your GUI layout -->
  </div>

  <!-- Install Button -->
  <button id="install">Install App</button>
  <p id="installStatus"></p>

  <!-- Fallback audio for old browsers -->
  <audio id="fallbackPlayer" src="song.mp3"></audio>

  <script src="app.js"></script>
</body>
</html>
